name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore Wayapay.sln

      - name: Build
        run: dotnet build Wayapay.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test tests/Wayapay.Tests/Wayapay.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category!=Live"
          --logger "console;verbosity=normal"
