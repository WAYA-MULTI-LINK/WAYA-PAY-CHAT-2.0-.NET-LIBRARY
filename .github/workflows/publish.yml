name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to create the GitHub Release and upload assets
  id-token: write   # enable GitHub OIDC token issuance for NuGet Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore Wayaquick.sln

      - name: Build
        run: dotnet build Wayaquick.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test tests/Wayaquick.Tests/Wayaquick.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category!=Live"
          --logger "console;verbosity=normal"

      - name: Pack
        run: dotnet pack src/Wayaquick/Wayaquick.csproj --configuration Release --no-build -o ./artifacts

      # Trusted Publishing: exchanges this run's OIDC token for a 1-hour API key,
      # per the policy configured on nuget.org (Trusted Publishing → publish.yml).
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.nupkg
          generate_release_notes: true
